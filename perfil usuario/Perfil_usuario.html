<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explora Risaralda - Perfil</title>
    <link rel="stylesheet" href="css/atyle_Perfil_usuario.css">
</head>
<body>
    <header>
        <nav class="barra-superior">
            <div class="logo">
            <h1>Explora Risaralda</h1>
            </div>
            <div class="iconos">
                <a href="#"><img src="buscar.png" alt="Buscar"></a>
                <a href="#"><img src="mapa.png" alt="Mapa"></a>
                <a href="#"><img src="notificacion.png" alt="Notificación"></a>
                <a href="#"> Registrarse /</a>
                <a href="#">Iniciar sesión</a>
            </div>
        </nav>
    
        <nav class="barra-inferior">
            <ul class="menu-inferior">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Hospedaje</a></li>
                <li><a href="#">Restaurantes</a></li>
                <li><a href="#">Cosas para Hacer</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="perfil-menu">
                <div class="perfil-image">
                    <span></span>
                </div>
                <p>Hola!</p>
                <div class="perfil-options">
                    <a href="#"><img src="" alt="">Perfil</a>
                    <a href="#"><img src="img/" alt="">Notificaciones</a>
                    <a href="#"><img src="img/corazon.png" alt="">Favoritos</a>
                    <a href="#"><img src="" alt="">Historial</a>
                    <a href="#"><img src="" alt="">Configuración</a>
                    <a href="#" class="logout">Cerrar sesión →</a>
                </div>
            </div>
            <div class="perfil-detalles">
                <div class="perfil-campo">
                    <label>Nombre Usuario</label>
                    <input type="text">
                </div>
                <div class="perfil-campo">
                    <label><img src="img/email.png" alt="email">Correo</label>
                    <input type="email">
                </div>
                <div class="perfil-campo">
                    <label>Nombre</label>
                    <input type="text">
                </div>
                <div class="perfil-campo">
                    <label><img src="img/casa.png" alt="casa">Lugar de residencia</label>
                    <input type="text">
                </div>
                <div class="perfil-campo">
                    <label><img src="img/cumple.png" alt="">Fecha de nacimiento</label>
                    <input type="date">
                </div>
                <div class="perfil-campo">
                    <label><img src="img/mas.png" alt="">Redes sociales</label>
                    <input type="text">
                </div>
                <div class="perfil-campo">
                    <label><img src="img/tel.png" alt="">Cel</label>
                    <input type="tel">
                </div>
                <div class="perfil-campo">
                    <label><img src="img/icons8-password-48.png" alt="">Contraseña</label>
                    <input type="password">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
