<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="css/style_notificaciones.css">
</head>
<body>

    <header>
        <nav class="barra-superior">
            <div class="logo">
            <h1>Explora Risaralda</h1>
            </div>
            <div class="iconos">
                <a href="#"><img src="img/busqueda.png" alt="Buscar"></a>
                <a href="#"><img src="img/ubicación.png" alt="Mapa"></a>
                <a href="#"><img src="img/notificación.png" alt="Notificación"></a>
                <a href="#"><img src="img/usuario.png" alt="Perfil de usuario"></a>
                
            </div>
        </nav>
    
        <nav class="barra-inferior">
            <ul class="menu-inferior">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Hospedaje</a></li>
                <li><a href="#">Restaurantes</a></li>
                <li><a href="#">Cosas para Hacer</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="perfil-menu">
                <div class="perfil-image">
                    <span></span>
                </div>
                <p>Hola!</p>
                <div class="perfil-options">
                    <a href="./Perfil_usuario.html"><img src="img/usuario.png">Perfil</a>
                    <a href="./perfil_usuario_notificaciones.html"><img src="img/notificación.png">Notificaciones</a>
                    <a href="./perfil_usuario_favoritos.html"><img src="img/corazon.png">Favoritos</a>
                    <a href="./perfil_usuario_configuracion.html"><img src="img/ajustes.png">Configuración</a>
                    <a href="#" class="logout">Cerrar sesión<img src="img/cerrar_sesión.png"></a>
                </div>
            </div>

            <div class="notificaciones-container">
                <div class="title-notificacion">
                    <h2>Notificaciones</h2>
                </div>
                <div class="notificacion-item">
                    <span>Notificaciones</span>
                    <label class="switch">
                        <input type="checkbox" id="notificaciones-generales">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="notificacion-item">
                    <span>Bonos</span>
                    <label class="switch">
                        <input type="checkbox" data-tipo="bonos" class="sub-notificacion">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="notificacion-item">
                    <span>Nuevos sitios</span>
                    <label class="switch">
                        <input type="checkbox" data-tipo="nuevos_sitios" class="sub-notificacion">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">&copy; 2026 Explora Risaralda | Todo los derechos reservados.</footer>
    
    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
